# Smithery configuration for Jurisprudência TRF4
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_trf4

name: trf4-mcp
displayName: "Jurisprudência TRF4"
description: >
  Pesquise jurisprudência do TRF4, que responde pela Justiça Federal no Rio Grande do Sul, Santa Catarina e Paraná, direto do seu agente de IA. Matéria previdenciária, tributária federal e responsabilidade da União, com órgão julgador, relator, data, o trecho que casou a busca e o link oficial. A mesma conexão alcança outros 16 tribunais, incluindo STJ e STF, para confrontar o entendimento regional com o superior. Grátis, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/trf4-mcp
repository: https://github.com/mcp-dir/trf4-mcp

tags:
  - trf4
  - justica-federal
  - previdenciario
  - tributario
  - jurisprudencia
  - case-law
  - brazil
  - read-only
  - no-auth
  - free

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_trf4

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_trf4/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
